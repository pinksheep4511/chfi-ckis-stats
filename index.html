<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radio Stats</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    @font-face {
      font-family: 'Minecraft Seven';
      src: url('fonts/MinecraftSeven-Regular.ttf') format('truetype');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Minecraft Seven';
      src: url('fonts/MinecraftSeven-Bold.ttf') format('truetype');
      font-weight: 700;
      font-display: swap;
    }
    :root {
      --background: #000;
      --surface: #111;
      --text: #f2f2f2;
      --text-muted: #8a8a8a;
      --border: #222;
      --chfi-accent: #00e5ff;
      --ckis-accent: #ff2e93;
      --accent: var(--chfi-accent); /* each .station-section overrides this with its selected station */
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: var(--background);
      color: var(--text);
      font-family: 'Minecraft Seven', system-ui, sans-serif;
    }
    h1 { margin: 0 0 24px; font-size: 1.5rem; }
    h2 { margin: 0 0 12px; font-size: 1.25rem; }
    .station-section {
      margin-bottom: 24px;
      padding: 20px;
      border: 2px solid var(--accent);
      border-radius: 16px;
    }
    .station-section h2 { color: var(--accent); }
    .station-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .station-tab {
      padding: 8px 20px;
      background: transparent;
      color: var(--text-muted);
      border: 2px solid var(--border);
      border-radius: 999px;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
    }
    .station-tab.active {
      color: var(--background);
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 700;
    }
    .status-message { color: var(--text-muted); padding: 8px 0; }

    /* Recently played */
    .day-group { margin-bottom: 8px; }
    .day-summary { cursor: pointer; padding: 10px 0; color: var(--accent); font-weight: 700; }
    .day-count { margin-left: 12px; color: var(--text-muted); font-weight: 400; }
    .track-list { display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px; }
    .track-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .track-art {
      flex: none;
      width: 64px;
      height: 64px;
      border-radius: 8px;
      background: var(--border);
      object-fit: cover;
    }
    .track-info { flex: 1; min-width: 0; }
    .track-title, .track-artist { overflow-wrap: anywhere; }
    .track-title { font-weight: 700; }
    .track-artist { margin-top: 4px; color: var(--text-muted); }
    .track-timing { flex: none; text-align: right; font-variant-numeric: tabular-nums; }
    .track-time { color: var(--accent); }
    .track-length { margin-top: 4px; color: var(--text-muted); font-size: 0.85rem; }

    /* Station summary stats */
    .station-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .station-stats:empty { display: none; }
    .stat-card {
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .stat-label { color: var(--text-muted); font-size: 0.85rem; }
    .stat-value {
      margin-top: 4px;
      color: var(--accent);
      font-size: 1.25rem;
      font-weight: 700;
      overflow-wrap: anywhere;
    }
    .stat-detail {
      margin-top: 4px;
      color: var(--text);
      font-weight: 400;
      font-size: 0.85rem;
      overflow-wrap: anywhere;
    }

    .section-toggle {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0;
      background: none;
      border: none;
      color: var(--accent);
      font-family: inherit;
      font-size: 1.25rem;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }
    #songs-content { margin-top: 12px; }

    /* Live radio */
    .radio-controls { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
    .radio-button {
      min-width: 96px;
      padding: 8px 24px;
      background: var(--accent);
      color: var(--background);
      border: 2px solid var(--accent);
      border-radius: 999px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .radio-volume { flex: 1; min-width: 0; accent-color: var(--accent); }
    #radio-now-playing { margin-top: 8px; }

    /* Song lists */
    .table-wrapper { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; min-width: 800px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); overflow-wrap: break-word; }
    th { color: var(--accent); cursor: pointer; user-select: none; }
    th:hover { text-decoration: underline; }
    .meter-value { display: block; font-variant-numeric: tabular-nums; }
    .meter-track { height: 4px; margin-top: 4px; background: var(--border); border-radius: 2px; }
    .meter-fill { height: 100%; background: var(--accent); border-radius: 2px; }

    /* Phones in portrait: use as much width as possible */
    @media (max-width: 600px) {
      body { padding: 8px; }
      h1 { margin-bottom: 12px; font-size: 1.25rem; }
      .station-section { margin-bottom: 12px; padding: 10px; border-width: 1px; border-radius: 12px; }
      .station-tab { flex: 1; padding: 8px 12px; } /* toggle buttons share the full width */
      .station-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .stat-card { padding: 8px; }
      .stat-value { font-size: 1.1rem; }
      .track-card { flex-wrap: wrap; gap: 8px 12px; padding: 8px; }
      .track-art { width: 48px; height: 48px; }
      .track-timing { flex-basis: 100%; display: flex; justify-content: space-between; text-align: left; }
      .track-length { margin-top: 0; }
      table { min-width: 640px; }
      th, td { padding: 8px 6px; }
      th:first-child, td:first-child { /* keeps the title visible while scrolling sideways */
        position: sticky;
        left: 0;
        min-width: 110px;
        max-width: 140px;
        background: var(--background);
      }
    }
  </style>
</head>
<body>
  <h1>Radio Stats</h1>
  <section class="station-section" id="radio-section">
    <h2>Live radio</h2>
    <div class="station-tabs" id="radio-station-tabs"></div>
    <div class="radio-controls">
      <button class="radio-button" id="radio-play-button">Play</button>
      <input class="radio-volume" id="radio-volume" type="range" min="0" max="100" value="70" aria-label="Volume">
    </div>
    <div class="status-message" id="radio-status-message"></div>
    <div class="stat-label">Now playing</div>
    <div id="radio-now-playing"></div>
  </section>

  <section class="station-section" id="recent-section">
    <h2>Recently played</h2>
    <div class="station-tabs" id="recent-station-tabs"></div>
    <div class="station-stats" id="recent-stats"></div>
    <div class="status-message" id="recent-status-message"></div>
    <div id="recent-days"></div>
  </section>

  <section class="station-section" id="songs-section">
    <button class="section-toggle" id="songs-toggle" aria-expanded="false" aria-controls="songs-content">
      <span>Song lists</span>
      <span class="section-toggle-icon" aria-hidden="true">+</span>
    </button>
    <div id="songs-content" hidden>
      <div class="station-tabs" id="songs-station-tabs"></div>
      <div class="status-message" id="songs-status-message"></div>
      <div class="table-wrapper"><table id="songs-table"></table></div>
    </div>
  </section>

  <script>
    const STATIONS = [
      {
        callSign: 'CHFI',
        csvPath: 'data/chfi-songs.csv',
        accentVariable: '--chfi-accent',
        streamUrl: 'https://rogers-hls.leanstream.co/rogers/tor981.stream/48k/playlist.m3u8',
      },
      {
        callSign: 'CKIS',
        csvPath: 'data/ckis-songs.csv',
        accentVariable: '--ckis-accent',
        streamUrl: 'https://rogers-hls.leanstream.co/rogers/tor925.stream/48k/playlist.m3u8',
      },
    ];
    const MAX_METER_VALUE = 100;
    const EMPTY_CELL_TEXT = '\u2014';
    const TIME_ZONE = 'America/Toronto';
    const RECENTLY_PLAYED_API_URL = 'https://script.google.com/macros/s/AKfycbyO8InJxfS1k7wqyasNp8Sd4dZb71WP0HT07RvWrYpdVZ5qN7ZeQBSUqNN7xQgwiLs/exec';
    const RECENTLY_PLAYED_REFRESH_MS = 60 * 1000;

    // ---------- Shared helpers ----------

    function isMissing(value) {
      return value === null || value === undefined || value === '';
    }

    function isSecureUrl(value) {
      return typeof value === 'string' && value.startsWith('https://');
    }

    function createElement(tagName, text, className) {
      const element = document.createElement(tagName);
      if (text !== undefined) element.textContent = text;
      if (className) element.className = className;
      return element;
    }

    // Builds one button per station inside containerElement.
    function createStationToggle(containerElement, onStationSelected) {
      STATIONS.forEach((station) => {
        const tab = createElement('button', station.callSign, 'station-tab');
        tab.dataset.callSign = station.callSign;
        tab.addEventListener('click', () => onStationSelected(station));
        containerElement.appendChild(tab);
      });
    }

    // Highlights the station's tab and gives the whole section that station's accent color.
    function markActiveStation(sectionElement, station) {
      sectionElement.style.setProperty('--accent', `var(${station.accentVariable})`);
      sectionElement.querySelectorAll('.station-tab').forEach((tab) => {
        tab.classList.toggle('active', tab.dataset.callSign === station.callSign);
      });
    }

    // ---------- Recently played ----------

    const recentSectionElement = document.getElementById('recent-section');
    const recentTabsElement = document.getElementById('recent-station-tabs');
    const recentStatusMessageElement = document.getElementById('recent-status-message');
    const recentDaysElement = document.getElementById('recent-days');
    const recentStatsElement = document.getElementById('recent-stats');

    const dateLabelFormatter = new Intl.DateTimeFormat('en-CA', { timeZone: TIME_ZONE }); // gives yyyy-MM-dd

    const recentTracksByCallSign = {};
    const openDayLabels = new Set(); // days the user has expanded; survives the automatic refresh
    let hasInitializedOpenDays = false;
    let activeRecentStation = STATIONS[0];

    // Pure calendar arithmetic, so daylight saving changes can't shift the day.
    function shiftDateLabel(dateLabel, dayOffset) {
      const [year, month, day] = dateLabel.split('-').map(Number);
      return new Date(Date.UTC(year, month - 1, day + dayOffset)).toISOString().slice(0, 10);
    }

    function buildDayLabel(dateLabel) {
      const todayLabel = dateLabelFormatter.format(new Date());
      const readableDate = new Date(`${dateLabel}T12:00:00Z`).toLocaleDateString('en-CA', {
        timeZone: 'UTC',
        weekday: 'long',
        month: 'long',
        day: 'numeric',
      });
      if (dateLabel === todayLabel) return `Today \u00b7 ${readableDate}`;
      if (dateLabel === shiftDateLabel(todayLabel, -1)) return `Yesterday \u00b7 ${readableDate}`;
      return readableDate;
    }

    function groupTracksByDate(tracks) {
      const tracksByDate = new Map(); // tracks arrive newest first, so days stay newest first
      tracks.forEach((track) => {
        if (!tracksByDate.has(track.play_date)) tracksByDate.set(track.play_date, []);
        tracksByDate.get(track.play_date).push(track);
      });
      return tracksByDate;
    }

    function createTrackArt(albumArtUrl) {
      if (!isSecureUrl(albumArtUrl)) return createElement('div', undefined, 'track-art'); // grey placeholder
      const art = createElement('img', undefined, 'track-art');
      art.src = albumArtUrl;
      art.alt = '';
      art.loading = 'lazy';
      return art;
    }

    function createTrackCard(track) {
      const info = createElement('div', undefined, 'track-info');
      info.append(
        createElement('div', track.title, 'track-title'),
        createElement('div', track.artist, 'track-artist')
      );

      const timing = createElement('div', undefined, 'track-timing');
      timing.append(
        createElement('div', track.start_time, 'track-time'),
        createElement('div', `${track.length_seconds} sec`, 'track-length')
      );

      const card = createElement('div', undefined, 'track-card');
      card.append(createTrackArt(track.album_art_url), info, timing);
      return card;
    }

    function createDayGroup(dateLabel, dayTracks) {
      const summary = createElement('summary', buildDayLabel(dateLabel), 'day-summary');
      summary.appendChild(createElement('span', `${dayTracks.length} tracks`, 'day-count'));

      const trackList = createElement('div', undefined, 'track-list');
      dayTracks.forEach((track) => trackList.appendChild(createTrackCard(track)));

      const dayGroup = createElement('details', undefined, 'day-group');
      dayGroup.open = openDayLabels.has(dateLabel);
      dayGroup.addEventListener('toggle', () => {
        if (dayGroup.open) openDayLabels.add(dateLabel);
        else openDayLabels.delete(dateLabel);
      });
      dayGroup.append(summary, trackList);
      return dayGroup;
    }

    function formatTotalDuration(totalSeconds) {
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      return `${hours}h ${minutes}m`;
    }

    function buildSongKey(track) {
      return `${track.artist} - ${track.title}`.trim().toLowerCase();
    }

    function buildTrackNameText(track) {
      return `${track.title} - ${track.artist}`;
    }

    // To add a stat, add one { label, value } object to the array this returns.
    function calculateStationStats(tracks) {
      const playCountBySongKey = new Map();
      let totalSeconds = 0;

      tracks.forEach((track) => {
        totalSeconds += Number(track.length_seconds) || 0;
        const songKey = buildSongKey(track);
        const songEntry = playCountBySongKey.get(songKey) || { track, playCount: 0 };
        songEntry.playCount += 1;
        playCountBySongKey.set(songKey, songEntry);
      });

      const mostPlayed = [...playCountBySongKey.values()].reduce(
        (best, songEntry) => (!best || songEntry.playCount > best.playCount ? songEntry : best),
        null
      );

      // Tracks with a missing or zero length are ignored for the length stats.
      const tracksWithLength = tracks.filter((track) => Number(track.length_seconds) > 0);
      const lengthStats = [];
      if (tracksWithLength.length > 0) {
        const shortestTrack = tracksWithLength.reduce((shortest, track) =>
          Number(track.length_seconds) < Number(shortest.length_seconds) ? track : shortest
        );
        const longestTrack = tracksWithLength.reduce((longest, track) =>
          Number(track.length_seconds) > Number(longest.length_seconds) ? track : longest
        );
        const averageSeconds = Math.round(totalSeconds / tracksWithLength.length);
        const validLengths = tracksWithLength.map((track) => Number(track.length_seconds));
        const medianSeconds = Math.round(getMedian(validLengths));
        lengthStats.push(
          {
            label: 'Average length',
            value: formatDuration(averageSeconds),
            detail: `Median ${formatDuration(medianSeconds)}`,
          },
          {
            label: 'Shortest track',
            value: formatDuration(Number(shortestTrack.length_seconds)),
            detail: buildTrackNameText(shortestTrack),
          },
          {
            label: 'Longest track',
            value: formatDuration(Number(longestTrack.length_seconds)),
            detail: buildTrackNameText(longestTrack),
          }
        );
      }

      return [
        { label: 'Plays (7 days)', value: tracks.length },
        { label: 'Unique songs', value: playCountBySongKey.size },
        { label: 'Total airtime', value: formatTotalDuration(totalSeconds) },
        ...lengthStats,
        {
          label: 'Most played',
          value: `${mostPlayed.playCount}x`,
          detail: buildTrackNameText(mostPlayed.track),
        },
      ];
    }

    function getMedian(numbers) {
      if (numbers.length === 0) return undefined;
    
      // Create a shallow copy and sort numerically
      const sorted = [...numbers].sort((a, b) => a - b);
      const mid = Math.floor(sorted.length / 2);
    
      // Return middle element if odd, or average of two middle elements if even
      return sorted.length % 2 !== 0
        ? sorted[mid]
        : (sorted[mid - 1] + sorted[mid]) / 2;
    }

    function renderStationStats(tracks) {
      recentStatsElement.replaceChildren();
      if (!tracks || tracks.length === 0) return;

      calculateStationStats(tracks).forEach((stat) => {
        const statCard = createElement('div', undefined, 'stat-card');
        statCard.append(
          createElement('div', stat.label, 'stat-label'),
          createElement('div', stat.value, 'stat-value')
        );
        if (stat.detail) statCard.appendChild(createElement('div', stat.detail, 'stat-detail'));
        recentStatsElement.appendChild(statCard);
      });
    }

    function renderRecentlyPlayed() {
      const tracks = recentTracksByCallSign[activeRecentStation.callSign];
      recentDaysElement.replaceChildren();
      renderStationStats(tracks);
      if (!tracks) return;

      const tracksByDate = groupTracksByDate(tracks);
      if (!hasInitializedOpenDays && tracksByDate.size > 0) {
        openDayLabels.add(tracksByDate.keys().next().value); // newest day starts expanded
        hasInitializedOpenDays = true;
      }
      tracksByDate.forEach((dayTracks, dateLabel) => {
        recentDaysElement.appendChild(createDayGroup(dateLabel, dayTracks));
      });

      recentStatusMessageElement.textContent = tracks.length === 0 ? 'No plays recorded yet.' : '';
    }

    async function fetchRecentTracks(station, queryParameters = {}) {
      const requestUrl = new URL(RECENTLY_PLAYED_API_URL);
      requestUrl.searchParams.set('station', station.callSign);
      Object.entries(queryParameters).forEach(([name, value]) => requestUrl.searchParams.set(name, value));
      const response = await fetch(requestUrl);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const payload = await response.json();
      if (payload.error) throw new Error(payload.error);
      return payload.tracks;
    }

    async function refreshRecentlyPlayed(station) {
      try {
        recentTracksByCallSign[station.callSign] = await fetchRecentTracks(station);
      } catch (error) {
        if (station === activeRecentStation) {
          recentStatusMessageElement.textContent = `Could not load recently played: ${error.message}`;
        }
        return;
      }
      if (station === activeRecentStation) renderRecentlyPlayed(); // ignore results for a station you've switched away from
    }

    function selectRecentStation(station) {
      activeRecentStation = station;
      markActiveStation(recentSectionElement, station);
      recentStatusMessageElement.textContent = recentTracksByCallSign[station.callSign] ? '' : 'Loading...';
      renderRecentlyPlayed(); // shows cached tracks instantly when this station was loaded before
      refreshRecentlyPlayed(station);
    }

    // ---------- Song lists ----------

    const songsSectionElement = document.getElementById('songs-section');
    const songsTabsElement = document.getElementById('songs-station-tabs');
    const songsStatusMessageElement = document.getElementById('songs-status-message');
    const songsTableElement = document.getElementById('songs-table');
    const songsToggleElement = document.getElementById('songs-toggle');
    const songsContentElement = document.getElementById('songs-content');

    function toggleSongsSection() {
      const willOpen = songsContentElement.hidden;
      songsContentElement.hidden = !willOpen;
      songsToggleElement.setAttribute('aria-expanded', String(willOpen));
      songsToggleElement.querySelector('.section-toggle-icon').textContent = willOpen ? '-' : '+';
    }

    // Column types: 'text', 'number', 'duration' (seconds shown as m:ss), 'meter' (0-100 with a bar).
    // The station duration header is built from the call sign, e.g. "chfi duration" or "ckis duration".
    function buildColumns(station) {
      return [
        { header: 'name', label: 'Title', type: 'text' },
        { header: 'artist', label: 'Artist', type: 'text' },
        { header: 'note count (combo)', label: 'Combo', type: 'number' },
        { header: 'base duration', label: 'Base length', type: 'duration' },
        { header: `${station.callSign.toLowerCase()} duration`, label: `${station.callSign} length`, type: 'duration' },
        { header: 'bpm', label: 'BPM', type: 'number' },
        { header: 'energy', label: 'Energy', type: 'meter' },
        { header: 'danceability', label: 'Danceability', type: 'meter' },
        { header: 'happiness', label: 'Happiness', type: 'meter' },
      ];
    }

    const songsByCallSign = {};
    let activeSongStation = STATIONS[0];
    let sortHeader = null;
    let sortDirection = 1; // 1 = ascending, -1 = descending

    function formatDuration(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = String(Math.round(totalSeconds % 60)).padStart(2, '0');
      return `${minutes}:${seconds}`;
    }

    function createCell(column, value) {
      const cell = createElement('td');
      if (isMissing(value)) {
        cell.textContent = EMPTY_CELL_TEXT;
      } else if (column.type === 'duration') {
        cell.textContent = formatDuration(value);
      } else if (column.type === 'meter') {
        const percent = Math.min(100, (value / MAX_METER_VALUE) * 100);
        const fill = createElement('div', undefined, 'meter-fill');
        fill.style.width = `${percent}%`;
        const track = createElement('div', undefined, 'meter-track');
        track.appendChild(fill);
        cell.append(createElement('span', value, 'meter-value'), track);
      } else {
        cell.textContent = value;
      }
      return cell;
    }

    function compareSongs(songA, songB) {
      const valueA = songA[sortHeader];
      const valueB = songB[sortHeader];
      if (isMissing(valueA) && isMissing(valueB)) return 0;
      if (isMissing(valueA)) return 1;  // missing values always last
      if (isMissing(valueB)) return -1;
      if (typeof valueA === 'number' && typeof valueB === 'number') {
        return (valueA - valueB) * sortDirection;
      }
      return String(valueA).localeCompare(String(valueB)) * sortDirection;
    }

    function handleHeaderClick(header) {
      sortDirection = sortHeader === header ? -sortDirection : 1;
      sortHeader = header;
      renderTable();
    }

    function renderTable() {
      const columns = buildColumns(activeSongStation);
      const songs = [...(songsByCallSign[activeSongStation.callSign] || [])];
      if (sortHeader) songs.sort(compareSongs);

      songsTableElement.replaceChildren();

      const headerRow = createElement('tr');
      columns.forEach((column) => {
        const headerCell = createElement('th', column.label);
        headerCell.addEventListener('click', () => handleHeaderClick(column.header));
        headerRow.appendChild(headerCell);
      });
      songsTableElement.appendChild(createElement('thead')).appendChild(headerRow);

      const body = songsTableElement.appendChild(createElement('tbody'));
      songs.forEach((song) => {
        const row = createElement('tr');
        columns.forEach((column) => row.appendChild(createCell(column, song[column.header])));
        body.appendChild(row);
      });

      songsStatusMessageElement.textContent = songs.length === 0 ? 'No songs yet. Add rows to the CSV file.' : '';
    }

    async function loadStationSongs(station) {
      const response = await fetch(station.csvPath);
      if (!response.ok) throw new Error(`${station.csvPath} returned HTTP ${response.status}`);
      const parsed = Papa.parse(await response.text(), {
        header: true,
        skipEmptyLines: true,
        dynamicTyping: true,
        transformHeader: (header) => header.trim(),
      });
      songsByCallSign[station.callSign] = parsed.data;
    }

    function selectSongStation(station) {
      activeSongStation = station;
      sortHeader = null;
      markActiveStation(songsSectionElement, station);
      renderTable();
    }

    // ---------- Live radio ----------

    const HLS_MIME_TYPE = 'application/vnd.apple.mpegurl';

    const radioSectionElement = document.getElementById('radio-section');
    const radioTabsElement = document.getElementById('radio-station-tabs');
    const radioPlayButtonElement = document.getElementById('radio-play-button');
    const radioVolumeElement = document.getElementById('radio-volume');
    const radioStatusMessageElement = document.getElementById('radio-status-message');
    const radioNowPlayingElement = document.getElementById('radio-now-playing');

    const radioAudioElement = new Audio();
    let activeRadioStation = STATIONS[0];
    let radioHls = null;
    let isRadioPlaying = false;

    function setRadioPlaying(isPlaying) {
      isRadioPlaying = isPlaying;
      radioPlayButtonElement.textContent = isPlaying ? 'Stop' : 'Play';
    }

    function releaseRadioStream() {
      if (radioHls) {
        radioHls.destroy();
        radioHls = null;
      }
      radioAudioElement.removeAttribute('src');
      radioAudioElement.load(); // closes the connection
    }

    // hls.js first: it handles audio-only HLS in every browser with Media Source support.
    // Native HLS is the fallback (iPhones without Media Source support), because some browsers
    // claim native support but fail on audio-only streams.
    function attachRadioStream(station) {
      releaseRadioStream();
      if (window.Hls && Hls.isSupported()) {
        radioHls = new Hls();
        radioHls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) handleRadioFailure(`Stream error: ${data.details}`);
        });
        radioHls.loadSource(station.streamUrl);
        radioHls.attachMedia(radioAudioElement);
        return true;
      }
      if (radioAudioElement.canPlayType(HLS_MIME_TYPE)) {
        radioAudioElement.src = station.streamUrl;
        return true;
      }
      return false;
    }

    function handleRadioFailure(message) {
      stopRadio();
      radioStatusMessageElement.textContent = message;
    }

    async function startRadio() {
      radioStatusMessageElement.textContent = 'Connecting...';
      if (!attachRadioStream(activeRadioStation)) {
        radioStatusMessageElement.textContent = 'This browser cannot play HLS streams.';
        return;
      }
      setRadioPlaying(true);
      try {
        await radioAudioElement.play();
        radioStatusMessageElement.textContent = '';
      } catch (error) {
        if (error.name === 'AbortError') return; // a newer start or stop replaced this request
        handleRadioFailure(`Could not start playback: ${error.message}`);
      }
    }

    function stopRadio() {
      radioAudioElement.pause();
      releaseRadioStream(); // so the next Play joins the live broadcast instead of resuming old audio
      setRadioPlaying(false);
    }

    function handleRadioPlayButtonClick() {
      if (isRadioPlaying) stopRadio();
      else startRadio();
    }

    function handleRadioVolumeInput() {
      radioAudioElement.volume = Number(radioVolumeElement.value) / 100;
    }

    async function refreshNowPlaying() {
      const station = activeRadioStation;
      try {
        const [latestTrack] = await fetchRecentTracks(station, { days: 2, limit: 1 });
        if (station !== activeRadioStation) return; // ignore results for a station you've switched away from
        radioNowPlayingElement.replaceChildren();
        if (latestTrack) radioNowPlayingElement.appendChild(createTrackCard(latestTrack));
        else radioNowPlayingElement.textContent = 'No track info yet.';
      } catch (error) {
        if (station !== activeRadioStation) return;
        radioNowPlayingElement.textContent = `Could not load now playing: ${error.message}`;
      }
    }

    function selectRadioStation(station) {
      activeRadioStation = station;
      markActiveStation(radioSectionElement, station);
      radioNowPlayingElement.replaceChildren();
      refreshNowPlaying();
      if (isRadioPlaying) startRadio(); // switches the stream without pressing Play again
    }

    // ---------- Start ----------

    async function start() {
      createStationToggle(radioTabsElement, selectRadioStation);
      radioPlayButtonElement.addEventListener('click', handleRadioPlayButtonClick);
      radioVolumeElement.addEventListener('input', handleRadioVolumeInput);
      handleRadioVolumeInput(); // applies the slider's starting position
      selectRadioStation(activeRadioStation);

      createStationToggle(recentTabsElement, selectRecentStation);
      createStationToggle(songsTabsElement, selectSongStation);
      songsToggleElement.addEventListener('click', toggleSongsSection);

      selectRecentStation(activeRecentStation);
      setInterval(() => {
        if (document.hidden) return; // skip while the tab is in the background
        refreshRecentlyPlayed(activeRecentStation);
        refreshNowPlaying();
      }, RECENTLY_PLAYED_REFRESH_MS);

      markActiveStation(songsSectionElement, activeSongStation);
      try {
        await Promise.all(STATIONS.map(loadStationSongs));
      } catch (error) {
        songsStatusMessageElement.textContent = `Could not load song data: ${error.message}`;
        return;
      }
      selectSongStation(activeSongStation);
    }

    start();
  </script>
</body>
</html>
