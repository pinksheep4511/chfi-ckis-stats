<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radio Comparison</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    @font-face { font-family: 'Minecraft Seven'; src: url('fonts/MinecraftSeven-Regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Minecraft Seven'; src: url('fonts/MinecraftSeven-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }
    :root {
      --background: #000; --surface: #111; --text: #f2f2f2; --text-muted: #8a8a8a; --border: #222;
      --chfi-accent: #00e5ff; --ckis-accent: #ff2e93;
      --better: #55ff55; --worse: #ff5555;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: var(--background); color: var(--text); font-family: 'Minecraft Seven', system-ui, sans-serif; }
    h1 { margin: 0 0 24px; font-size: 1.5rem; }
    .controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 16px; }
    select, button { font-family: inherit; font-size: 1rem; padding: 8px 16px; background: var(--surface); color: var(--text); border: 2px solid var(--border); border-radius: 999px; }
    button { cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    .status-message { color: var(--text-muted); padding: 8px 0; }
    .table-wrapper { overflow-x: auto; margin-bottom: 24px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    td:not(:first-child), th:not(:first-child) { text-align: right; }
    .section-header { text-align: left !important; background: var(--surface); }
    .better { color: var(--better); }
    .worse { color: var(--worse); }
    .recent-lists { display: flex; flex-wrap: wrap; gap: 16px; }
    .recent-column { flex: 1 1 320px; min-width: 0; }
    .track-card { padding: 10px; margin-bottom: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
    .track-title { overflow-wrap: anywhere; }
    .track-time { color: var(--text-muted); font-size: 0.85rem; margin-top: 2px; }
    .track-stats { color: #55ffff; font-size: 0.85rem; margin-top: 4px; }
    .track-unmatched { color: var(--worse); font-size: 0.85rem; margin-top: 4px; }
    @media (max-width: 600px) { body { padding: 8px; } }
  </style>
</head>
<body>
  <h1>Radio Comparison</h1>

  <div class="controls">
    <label>Station
      <select id="station-select">
        <option value="BOTH">Both</option>
        <option value="CHFI">CHFI</option>
        <option value="CKIS">CKIS</option>
      </select>
    </label>
    <label><input type="checkbox" id="show-song-stats"> Show song stats</label>
    <button id="run-button">Run comparison</button>
  </div>

  <div class="status-message" id="status-message"></div>
  <div class="table-wrapper"><table id="comparison-table"></table></div>
  <div class="recent-lists" id="recent-lists"></div>

  <script type="module" src="js/radio-comparison.js"></script>
</body>
</html>
